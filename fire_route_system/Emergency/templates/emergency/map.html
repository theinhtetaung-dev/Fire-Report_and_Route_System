{% extends 'emergency/base.html' %}{% block content %}<h1>စခန်းနှင့် အတည်ပြုထားသော လက်ရှိဖြစ်စဉ်များ</h1><p id="map-status" role="status"></p><div id="map" class="map"></div>{% endblock %}{% block scripts %}<script>const map=L.map('map').setView([21.975,96.083],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).on('tileerror',()=>{document.getElementById('map-status').textContent='မြေပုံနောက်ခံ မရပါ။ စခန်းနှင့်ဖြစ်စဉ် pin များ ဆက်ကြည့်နိုင်ပါသည်။';}).addTo(map);const group=L.layerGroup().addTo(map);async function updateMap(){try{const r=await fetch('{% url "emergency:map_data" %}');if(!r.ok)return;const d=await r.json();group.clearLayers();d.stations.forEach(s=>{const label=document.createElement('span');label.textContent=s.name;L.circleMarker([s.latitude,s.longitude],{color:'#17578a'}).bindPopup(label).addTo(group);});d.incidents.forEach(i=>{const label=document.createElement('span');label.textContent='#'+i.id+' '+(i.address||'မီးလောင်ရာ')+' · Level '+i.fire_scale;L.circleMarker([i.latitude,i.longitude],{color:'#b62231'}).bindPopup(label).addTo(group);});}catch(e){document.getElementById('map-status').textContent='ဆက်သွယ်မှု မရပါ။';}}updateMap();setInterval(updateMap,5000);</script>{% endblock %}
