<form class="filters"><label>ရှာရန်<input name="q" value="{{ request.GET.q }}"></label><label>အခြေအနေ<select name="status"><option value="">အားလုံး</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Level<select name="level"><option value="">အားလုံး</option>{% for value,label in levels %}<option value="{{ value }}" {% if request.GET.level == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>စတင်ရက်<input type="date" name="start" value="{{ request.GET.start }}"></label><label>ပြီးဆုံးရက်<input type="date" name="end" value="{{ request.GET.end }}"></label><button>စစ်ထုတ်ရန်</button></form>
