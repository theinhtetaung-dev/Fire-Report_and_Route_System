<form class="filters"><label>မှတ်တမ်းရင်းမြစ်<select name="source"><option value="">အားလုံး</option><option value="historical" {% if request.GET.source == 'historical' %}selected{% endif %}>သမိုင်းမှတ်တမ်း</option></select></label><label>ရှာရန်<input name="q" value="{{ request.GET.q }}"></label><label>အခြေအနေ<select name="status"><option value="">အားလုံး</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>Level<select name="level"><option value="">အားလုံး</option>{% for value,label in levels %}<option value="{{ value }}" {% if request.GET.level == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>{% endfor %}</select></label><label>စတင်ရက်<input type="text" placeholder="DD/MM/YYYY" name="start" value="{{ request.GET.start }}"></label><label>ပြီးဆုံးရက်<input type="text" placeholder="DD/MM/YYYY" name="end" value="{{ request.GET.end }}"></label><button>စစ်ထုတ်ရန်</button></form>
